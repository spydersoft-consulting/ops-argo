configFile: config/in-cluster-local.alloy

syslog:
  enabled: true
  port: 1514
  nodePort: 31050
  tcpPort: 1515
  tcpNodePort: 31051

alloy:
  image:
    # Pinned to v1.19.0. v1.19.2 has an intermittent unpack corruption on its
    # compressed layer (deterministic per-pod once it happens, reproduced on
    # a brand-new node) - same issue already root-caused and pinned around in
    # production (see cluster-tools/tools/grafana-alloy/config/production-values.yaml).
    # Do not remove this pin without root-causing the underlying image issue.
    tag: v1.19.0
  alloy:
    extraPorts:
      - name: "otlp-grpc"
        port: 4317
        targetPort: 4317
        protocol: "TCP"
      - name: "otlp-http"
        port: 4318
        targetPort: 4318
        protocol: "TCP"
      - name: "udp-syslog"
        port: 1514
        targetPort: 1514
        protocol: "UDP"
      - name: "tcp-syslog"
        port: 1515
        targetPort: 1515
        protocol: "TCP"
    configMap:
      create: false
      name: in-cluster-local-grafana-alloy-config