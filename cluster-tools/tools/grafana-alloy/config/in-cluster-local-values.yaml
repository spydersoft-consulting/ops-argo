configFile: config/in-cluster-local.alloy

syslog:
  enabled: true
  port: 1514
  nodePort: 31050
  tcpPort: 1515
  tcpNodePort: 31051

alloy:
  image:
    # Retrying v1.19.2 (2026-09-18). Earlier "unpack corruption" reports on
    # this version were "fixed" with a plain `crictl rmi` + pod redeploy,
    # which we've since found only clears the image ref and top snapshot -
    # it leaves containerd's dangling pull-protection leases (and whatever
    # content they're pinning) in place. A full purge (image + content
    # blobs + leases) resolved an unrelated v1.19.0 corruption on
    # gk-internal-agt-0d9 that a plain rmi did not. Rolling out v1.19.2
    # again only after doing that fuller purge on every node in each
    # cluster. If it recurs after that, treat it as a real image issue.
    tag: v1.19.2
  alloy:
    extraPorts:
      - name: "otlp-grpc"
        port: 4317
        targetPort: 4317
        protocol: "TCP"
      - name: "otlp-http"
        port: 4318
        targetPort: 4318
        protocol: "TCP"
      - name: "udp-syslog"
        port: 1514
        targetPort: 1514
        protocol: "UDP"
      - name: "tcp-syslog"
        port: 1515
        targetPort: 1515
        protocol: "TCP"
    configMap:
      create: false
      name: in-cluster-local-grafana-alloy-config