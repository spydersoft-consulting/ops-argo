configFile: config/nonproduction.alloy

alloy:
  image:
    # Retrying v1.19.2 (2026-09-18) - see the comment in
    # config/in-cluster-local-values.yaml for why. Rolling out only after a
    # full image+content+lease purge on every node in this cluster.
    tag: v1.19.2
  controller:
    hostPID: true
    volumes:
      extra:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
  alloy:
    configMap:
      create: false
      name: nonproduction-grafana-alloy-config
    mounts:
      extra:
        - mountPath: /host/proc
          name: proc
          readOnly: true
        - mountPath: /host/sys
          name: sys
          readOnly: true
        - mountPath: /host/root
          name: root
          readOnly: true
          mountPropagation: HostToContainer