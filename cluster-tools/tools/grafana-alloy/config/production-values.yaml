configFile: config/production.alloy

alloy:
  image:
    # Pinned to v1.19.0. v1.19.2 reproducibly fails with "exec format error"
    # on specific production nodes (confirmed on gk-production-agt-09e even
    # under calm, idle conditions with no concurrent reboots or containerd
    # manipulation) while running fine on the exact same node with v1.19.0 -
    # so this is not a load/timing race, it's deterministic per-node for this
    # image version specifically, and not yet understood. Do not re-attempt
    # v1.19.2 without root-causing this first.
    tag: v1.19.0
  alloy:
    configMap:
      create: false
      name: production-grafana-alloy-config
