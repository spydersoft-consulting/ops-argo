    # concurrent node reboots/rescheduling plus direct containerd content-store
    # surgery during incident response, not an inherent flaw in this version -
    # nonprod/internal never saw it. If it recurs, drop back to v1.19.0.
    tag: v1.19.2
  alloy:
    configMap:
      create: false
      name: production-grafana-alloy-config
