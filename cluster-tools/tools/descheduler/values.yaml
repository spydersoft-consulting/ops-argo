descheduler:
  kind: CronJob
  # Conservative interval for a first rollout - the chart default (every
  # 2 minutes) is too aggressive before we've watched this run at all.
  # Tighten once dry-run output looks sane and this has run live a while.
  schedule: "*/10 * * * *"

  # Keep etcd footprint small - just enough history to check the last
  # success/failure without pulling logs live.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

  cmdOptions:
    v: 3
    # Dry-run's own eviction preview turned out to be untrustworthy: it runs
    # as a fresh process each CronJob invocation and evaluates a fake
    # in-memory clientset that's still being asynchronously seeded from the
    # real cluster when the balance cycle runs, so every dry-run so far saw
    # 0% utilization everywhere and never found anything to evict - not a
    # real "all clear". Going live instead, backed by maxNoOfPodsToEvictPerNode
    # / PerNamespace below plus PDBs now added for the single-replica
    # StatefulSets that had none.
    dry-run: false

  deschedulerPolicy:
    # Rate-limit once this goes live - rebalance gradually across
    # scheduled runs rather than evicting a large batch at once.
    maxNoOfPodsToEvictPerNode: 2
    maxNoOfPodsToEvictPerNamespace: 5

    profiles:
      - name: default
        pluginConfig:
          # Deliberately NOT setting podProtections here (the chart's own
          # example values.yaml sets extraEnabled: ["PodsWithPVC"], which
          # opts PVC-backed pods INTO eviction - exactly the pods most at
          # risk given we don't have PDBs everywhere). Omitting args keeps
          # the descheduler binary's own conservative defaults: PVC-backed
          # and local-storage pods stay protected regardless of PDBs.
          - name: DefaultEvictor
          - name: RemoveDuplicates
          - name: RemovePodsViolatingTopologySpreadConstraint
          - name: LowNodeUtilization
            args:
              # A node only counts as "underutilized" (a valid eviction
              # target) if ALL three of these are below threshold - it's
              # an AND, not an OR. cpu: 20 left every node ineligible: the
              # control-plane nodes run a fixed ~65-70% cpu from
              # etcd/apiserver/scheduler overhead alone regardless of app
              # load, and even the one genuinely idle agent node sat at
              # ~31% cpu (pods/memory were both comfortably under 20%).
              # Raised to 40 to give that headroom without pulling the
              # control-plane nodes' baseline into range.
              thresholds:
                cpu: 40
                memory: 20
                pods: 20
              targetThresholds:
                cpu: 50
                memory: 50
                pods: 50
        plugins:
          balance:
            enabled:
              - RemoveDuplicates
              - RemovePodsViolatingTopologySpreadConstraint
              - LowNodeUtilization
          # Intentionally empty - RemovePodsHavingTooManyRestarts /
          # RemovePodsViolatingNodeTaints / RemovePodsViolatingNodeAffinity /
          # RemovePodsViolatingInterPodAntiAffinity aren't related to the
          # node-imbalance problem this was added for. Add them later,
          # deliberately, if a specific need comes up.
          deschedule:
            enabled: []

  podAnnotations:
    logs.spydersoft.io/collect: "true"
    logs.spydersoft.io/format: "text"
