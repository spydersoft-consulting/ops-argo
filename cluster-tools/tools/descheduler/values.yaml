descheduler:
  kind: CronJob
  # Conservative interval for a first rollout - the chart default (every
  # 2 minutes) is too aggressive before we've watched this run at all.
  # Tighten once dry-run output looks sane and this has run live a while.
  schedule: "*/10 * * * *"

  # Keep etcd footprint small - just enough history to check the last
  # success/failure without pulling logs live.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

  cmdOptions:
    v: 3
    # Dry-run's own eviction preview turned out to be untrustworthy: it runs
    # as a fresh process each CronJob invocation and evaluates a fake
    # in-memory clientset that's still being asynchronously seeded from the
    # real cluster when the balance cycle runs, so every dry-run so far saw
    # 0% utilization everywhere and never found anything to evict - not a
    # real "all clear". Going live instead, backed by maxNoOfPodsToEvictPerNode
    # / PerNamespace below plus PDBs now added for the single-replica
    # StatefulSets that had none.
    dry-run: false

  deschedulerPolicy:
    # Rate-limit once this goes live - rebalance gradually across
    # scheduled runs rather than evicting a large batch at once.
    maxNoOfPodsToEvictPerNode: 4
    maxNoOfPodsToEvictPerNamespace: 5

    # Control-plane nodes never count as eviction sources or rebalancing
    # targets. Without this, nonproduction's 3-node shape (1 control-plane
    # + 2 agents) trips the pods thresholds below on completely normal
    # load - with only 2 agent nodes to split work across, a 29%/22%
    # split is unremarkable, but the only "underutilized" node under
    # those thresholds is the control-plane node, which would pull
    # workload pods onto it just to satisfy the check.
    nodeSelector: "!node-role.kubernetes.io/control-plane"

    profiles:
      - name: default
        pluginConfig:
          # Deliberately NOT setting podProtections here (the chart's own
          # example values.yaml sets extraEnabled: ["PodsWithPVC"], which
          # opts PVC-backed pods INTO eviction - exactly the pods most at
          # risk given we don't have PDBs everywhere). Omitting args keeps
          # the descheduler binary's own conservative defaults: PVC-backed
          # and local-storage pods stay protected regardless of PDBs.
          - name: DefaultEvictor
          - name: RemoveDuplicates
          - name: RemovePodsViolatingTopologySpreadConstraint
          - name: LowNodeUtilization
            args:
              # cpu/memory thresholds don't work here and were dropped
              # after two rounds of chasing them: a node only counts as
              # "underutilized" if ALL configured resources are below
              # threshold (AND), and "overutilized" if ANY is above
              # target (OR). Every control-plane node runs a fixed
              # ~65-70% cpu from etcd/apiserver/scheduler overhead alone,
              # in every cluster, regardless of app load - that's not
              # fixable by rebalancing and kept tripping the overutilized
              # OR-check for nodes we don't actually want to evict from.
              # Meanwhile the one genuinely idle agent node's memory
              # crept past each threshold we set as soon as a couple of
              # pods landed on it, since absolute percentages don't hold
              # still while the tool is actively rebalancing.
              #
              # Pod count percentage doesn't have either problem - an
              # idle node has few pods regardless of its role or the
              # cluster's baseline load, so it's comparable across nodes
              # and across clusters without per-cluster tuning. Verified
              # against live numbers in all three clusters: 15/25 flags
              # production's real imbalance (one node at 45% pods vs.
              # 5-7% everywhere else) while leaving internal and
              # nonproduction untouched, since neither has anything close
              # to that skew today.
              thresholds:
                pods: 15
              targetThresholds:
                pods: 25
        plugins:
          balance:
            enabled:
              - RemoveDuplicates
              - RemovePodsViolatingTopologySpreadConstraint
              - LowNodeUtilization
          # Intentionally empty - RemovePodsHavingTooManyRestarts /
          # RemovePodsViolatingNodeTaints / RemovePodsViolatingNodeAffinity /
          # RemovePodsViolatingInterPodAntiAffinity aren't related to the
          # node-imbalance problem this was added for. Add them later,
          # deliberately, if a specific need comes up.
          deschedule:
            enabled: []

  podAnnotations:
    logs.spydersoft.io/collect: "true"
    logs.spydersoft.io/format: "text"
